spring:
  codec:
    max-in-memory-size: 6MB
  application:
    name: qiqi-data-agent
  datasource:
    url: jdbc:h2:mem:qiqi;MODE=MySQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password:
  sql:
    init:
      mode: always

server:
  port: 8080

qiqi:
  storage:
    directory: ${QIQI_STORAGE_DIR:.qiqi}
  web-search:
    enabled: ${QIQI_WEB_SEARCH_ENABLED:false}
    api-key: ${TAVILY_API_KEY:}
    timeout: 15s
  chart:
    enabled: ${QIQI_CHART_ENABLED:false}
    mcp-url: ${QIQI_CHART_MCP_URL:http://localhost:3033/mcp}
    timeout: 30s
  model:
    provider: ${QIQI_MODEL_PROVIDER:dashscope}
    base-url: ${QIQI_MODEL_BASE_URL:}
    api-key: ${QIQI_MODEL_API_KEY:${DASHSCOPE_API_KEY:}}
    name: ${QIQI_MODEL:qwen-plus}
    max-iterations: 24
  query:
    max-rows: 200
    timeout: 10s
  exposed-tables:
    - department
    - customer
    - product
    - sales_order
    - sales_order_item
